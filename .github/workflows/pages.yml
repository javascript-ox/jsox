name: GitHub Pages

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out stable
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable
      - name: Check out development
        uses: actions/checkout@v4
        with:
          ref: develop
          path: development
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            stable/package-lock.json
            development/package-lock.json
      - name: Build stable
        working-directory: stable
        env:
          VITE_JSOX_CHANNEL: stable
        run: |
          npm ci
          npm test
          npm run build:site
      - name: Build development
        working-directory: development
        env:
          VITE_JSOX_CHANNEL: develop
        run: |
          npm ci
          npm test
          npm run build:site
      - name: Assemble both channels
        run: |
          mkdir -p publish/develop
          cp -R stable/_site/. publish/
          cp -R development/_site/. publish/develop/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
